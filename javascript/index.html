<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora JavaScript</title><link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="card">
    <div class="badge">JAVASCRIPT</div><h1>Calculadora</h1><p class="sub">Operações básicas, sem complicação.</p>
    <label for="a">Primeiro número</label><input id="a" inputmode="decimal" placeholder="Ex.: 12,5">
    <label for="op">Operação</label><select id="op"><option value="add">Adição (+)</option><option value="subtract">Subtração (−)</option><option value="multiply">Multiplicação (×)</option><option value="divide">Divisão (÷)</option></select>
    <label for="b">Segundo número</label><input id="b" inputmode="decimal" placeholder="Ex.: 2">
    <button id="calculate">Calcular</button><output id="result" aria-live="polite">O resultado aparece aqui</output>
  </main><script src="/src/calculator.js"></script><script src="/ui.js"></script>
</body></html>
